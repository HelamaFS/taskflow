<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">

        <h1>TaskFlow</h1>

        <p class="subtitulo">
            Sistema de Controle de Tarefas
        </p>

        <form action="/adicionar" method="POST">

            <input
                type="text"
                name="descricao"
                placeholder="Digite uma nova tarefa..."
                required
            >

            <button type="submit">
                Adicionar
            </button>

        </form>

        <section class="tarefas">

            <h2>Minhas tarefas</h2>

            {% if tarefas %}

                {% for tarefa in tarefas %}

                    <div class="tarefa {% if tarefa['concluida'] %}concluida{% endif %}">

                        <form
                            action="/editar/{{ tarefa['id'] }}"
                            method="POST"
                            class="form-editar"
                        >

                            <input
                                type="text"
                                name="descricao"
                                value="{{ tarefa['descricao'] }}"
                                id="tarefa-{{ tarefa['id'] }}"
                                readonly
                                required
                            >

                            <button
                                type="button"
                                class="btn-editar"
                                data-id="{{ tarefa['id'] }}"
                            >
                                Editar
                            </button>

                        </form>

                        <form
                            action="/concluir/{{ tarefa['id'] }}"
                            method="POST"
                        >

                            {% if tarefa['concluida'] %}

                                <button type="submit">
                                    Reabrir
                                </button>

                            {% else %}

                                <button type="submit">
                                    Concluir
                                </button>

                            {% endif %}

                        </form>

                        <form
                            action="/excluir/{{ tarefa['id'] }}"
                            method="POST"
                        >

                            <button
                                type="submit"
                                class="btn-excluir"
                            >
                                Excluir
                            </button>

                        </form>

                    </div>

                {% endfor %}

            {% else %}

                <p class="vazio">
                    Nenhuma tarefa cadastrada.
                </p>

            {% endif %}

        </section>

    </main>

    
<script>
    const botoesEditar = document.querySelectorAll(".btn-editar");

    botoesEditar.forEach(function (botao) {

        botao.addEventListener("click", function () {

            const id = botao.dataset.id;
            const campo = document.getElementById("tarefa-" + id);
            const formulario = botao.closest("form");

            if (campo.hasAttribute("readonly")) {
                // Primeiro clique: habilita a edição
                campo.removeAttribute("readonly");
                campo.focus();
                botao.textContent = "Salvar";

            } else {
                // Segundo clique: salva a alteração
                if (campo.value.trim() !== "") {
                    formulario.requestSubmit();
                } else {
                    campo.focus();
                }
            }

        });

    });
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - TaskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <main class="container caixa-autenticacao">
        <h1>TaskFlow</h1>
        <p class="subtitulo">Crie sua conta</p>

        {% with mensagens = get_flashed_messages() %}
            {% for mensagem in mensagens %}
                <p class="mensagem">{{ mensagem }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('cadastro') }}" method="POST" class="form-autenticacao">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome"
                   value="{{ nome }}" maxlength="100" autocomplete="name" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Seu e-mail"
                   value="{{ email }}" maxlength="254" autocomplete="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Crie uma senha (mínimo 8 caracteres)"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirmar_senha">Confirmar senha</label>
            <input type="password" id="confirmar_senha" name="confirmar_senha"
                   placeholder="Confirme sua senha"
                   minlength="8" autocomplete="new-password" required>

            <button type="submit">Criar conta</button>
        </form>

        <p class="texto-autenticacao">
            Já tem uma conta? <a href="{{ url_for('login') }}">Entrar</a>
        </p>
    </main>
</body>
</html>
